<title>Mike Spear - Outlook signature</title>
<!--
  RAW OUTLOOK SIGNATURE FILE. Not a web page - this is what gets written to
  %APPDATA%\Microsoft\Signatures\ on each machine, verbatim.

  Kept deliberately free of any wrapper markup so it can be downloaded straight
  into place. Every image is an absolute https URL on this domain: linked, never
  embedded, so the images survive being quoted in reply chains.

  Pure ASCII - the (R) and the middot separators are numeric entities - so no
  encoding conversion can corrupt it in transit.

  Do not open and re-save this signature in Outlook's Signatures dialog. Word
  rewrites the img tags to local image001.png attachments, which is the exact
  failure this file exists to avoid. Edit here, push, re-run the installer.
-->

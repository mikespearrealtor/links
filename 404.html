<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Mike Spear, Compass Real Estate</title>
  <meta name="robots" content="noindex">

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --text: #ffffff;
      --muted: #9a9a9a;
      --faint: #757575;
      --footer: #575757;
      --footer-link: #9a9a9a;
      --card: #161616;
      --card-border: #262626;
      --card-hover: #1d1d1d;
      --card-border-hover: #333333;
      --icon-bg: #232323;
      --icon-stroke: #d4d4d4;
      --small: #9e9e9e;
      --chev: #6e6e6e;
      --seal-border: rgba(0,0,0,0);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f6f5f3;
      --text: #111111;
      --muted: #666666;
      --faint: #8a8a8a;
      --footer: #9a9a9a;
      --footer-link: #666666;
      --card: #ffffff;
      --card-border: #e3e1dd;
      --card-hover: #faf9f7;
      --card-border-hover: #d0cec9;
      --icon-bg: #f0eeea;
      --icon-stroke: #444444;
      --small: #8a8a8a;
      --chev: #b3b1ad;
      --seal-border: #e3e1dd;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      padding: 48px 24px;
    }

    .seal {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--seal-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .seal img {
      height: 40px;
      width: auto;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .lead {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    a.btn {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px 16px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    }

    a.btn:hover {
      background: var(--card-hover);
      border-color: var(--card-border-hover);
    }

    a.btn:active {
      transform: scale(0.985);
    }

    a.btn:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 18px;
      height: 18px;
      stroke: var(--icon-stroke);
    }

    .btn-label {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.005em;
    }

    .btn-label small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: var(--small);
      margin-top: 2px;
    }

    .chev {
      flex-shrink: 0;
      width: 15px;
      height: 15px;
      stroke: var(--chev);
    }

    footer {
      font-size: 12px;
      color: var(--footer);
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.7;
    }

    footer a {
      color: var(--footer-link);
      text-decoration: none;
    }

    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      padding: 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .theme-toggle:hover {
      background: var(--card-hover);
      border-color: var(--card-border-hover);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      stroke: var(--icon-stroke);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle .moon { display: none; }
    [data-theme="light"] .theme-toggle .sun { display: none; }
    [data-theme="light"] .theme-toggle .moon { display: block; }

    @media (prefers-reduced-motion: no-preference) {
      .seal, .eyebrow, h1, .lead, .links, footer { animation: rise 0.5s ease backwards; }
      .seal { animation-delay: 0s; }
      .eyebrow { animation-delay: 0.06s; }
      h1 { animation-delay: 0.1s; }
      .lead { animation-delay: 0.14s; }
      .links { animation-delay: 0.2s; }
      footer { animation-delay: 0.26s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark theme">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <div class="wrap">

    <span class="seal"><img src="/monogram.png" alt="MS"></span>

    <p class="eyebrow">Mike Spear &middot; Compass Real Estate</p>
    <h1>That link didn't lead anywhere.</h1>
    <p class="lead">The page may have moved, or the address has a typo. Try one of these instead:</p>

    <div class="links">

      <a class="btn" href="/">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 18.5"/></svg>
        </span>
        <span class="btn-label">All my links<small>Profiles, contact, and more</small></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

      <a class="btn" href="https://files.mikespear.com/docs">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 13h6M9 17h6"/></svg>
        </span>
        <span class="btn-label">Documents<small>TREC notices and disclosures</small></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>

    </div>

    <footer>Looking for me? <a href="tel:+17132047653">713-204-7653</a> &middot; <a href="mailto:mike@mikespear.com">mike@mikespear.com</a></footer>

  </div>

  <script>
    document.getElementById('themeToggle').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>

</body>
</html>

name: Scrape Compass listings

# Refreshes listings.json from the Compass agent profile once per day.
# Committing to main republishes the Pages site automatically.

on:
  schedule:
    # GitHub's scheduler is best-effort: a cron can be delayed under load or
    # dropped outright, with no event, no run and no failure to notice it by.
    # So the job is offered three windows a day instead of one. They are
    # attempts at the same day's work, not three days' work - the `check` job
    # below stops the later two once any of them has succeeded.
    #
    # The odd minute is deliberate. Everybody's crons pile up on the hour,
    # which is exactly when GitHub is most likely to drop one.
    #
    # 11:17 UTC = ~6:17am Houston (CDT) / 5:17am (CST). GitHub runs cron in
    # UTC and does not adjust for daylight saving.
    - cron: "17 11 * * *"
    - cron: "17 15 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # the guard below reads this workflow's own run history

concurrency:
  group: scrape-listings
  cancel-in-progress: false

jobs:
  # Holds Compass to a single fetch on a normal day. Without this, three
  # schedules would mean three scrapes; with it, the second and third exit in
  # a few seconds having touched nothing but the GitHub API.
  check:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Has today's scrape already succeeded?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual run is deliberate - never second-guess it.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run; proceeding."
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today=$(date -u +%Y-%m-%d)
          # Fail open. If this lookup breaks, scrape a second time rather than
          # silently skip a day: one extra fetch beats a stale site.
          count=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/scrape-listings.yml/runs?per_page=50" \
            --jq "[.workflow_runs[]
                   | select(.conclusion == \"success\")
                   | select(.created_at | startswith(\"$today\"))] | length"
          ) || count=0

          if [ "${count:-0}" -gt 0 ]; then
            echo "Already succeeded today; skipping. Compass not contacted."
            echo "proceed=no" >> "$GITHUB_OUTPUT"
            echo "Skipped - today's scrape already succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No successful run yet today; proceeding."
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: check
    if: needs.check.outputs.proceed == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No dependencies to install - the scraper is stdlib only.
      - name: Scrape listings
        run: python tools/scrape-listings.py --no-backup | tee scrape.log

      # Fills in coordinates for any address not already in geo.json. A
      # normal day needs zero lookups. Never fails the run: an address it
      # cannot place just loses its dot, and the map says how many it lost.
      - name: Geocode new addresses
        continue-on-error: true
        run: python tools/geocode.py | tee geocode.log

      # Exit 3 is "a section was hidden because its data was unusable". That
      # is a successful render - the fix has to be committed below before the
      # run is allowed to fail, or the broken section stays on the live site.
      - name: Render into index.html
        run: |
          set +e
          python tools/render-listings.py | tee render.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "3" ]; then
            echo "hidden=yes" >> "$GITHUB_ENV"
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi

      - name: Commit if changed
        run: |
          # --porcelain also reports a file as untracked, which a plain
          # `git diff` would miss on the very first run.
          if [ -z "$(git status --porcelain -- listings.json sold.json geo.json index.html)" ]; then
            echo "No listing changes today."
            echo "changed=no" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "changed=yes" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json sold.json geo.json index.html
          git commit -m "Update listings from Compass profile"
          git push

      # Readable at-a-glance record on each run's own page, so a failure or a
      # surprising listing count is obvious without opening the raw logs.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Compass listings scrape"
            echo
            if [ "${hidden:-no}" = "yes" ]; then
              echo "**Result:** DATA REJECTED - a section was hidden from the site"
              echo
              echo "The scrape produced something that did not look like real"
              echo "listings, so the affected section was removed rather than"
              echo "published. The site is safe; the scraper needs a look."
            elif [ "${{ job.status }}" = "success" ]; then
              COUNT=$(python -c "import json;print(len(json.load(open('listings.json'))))" 2>/dev/null || echo "?")
              SOLD=$(python -c "import json;print(len(json.load(open('sold.json'))))" 2>/dev/null || echo "?")
              echo "**Result:** OK - $COUNT listing(s), $SOLD closed sale(s) on the profile"
              if [ "${changed:-no}" = "yes" ]; then
                echo "**Site:** updated and pushed"
              else
                echo "**Site:** no change since yesterday"
              fi
            else
              echo "**Result:** FAILED - the site was not modified"
              echo
              echo "Most likely Compass changed their page layout. See the failed step above."
            fi
            echo
            echo '```'
            cat scrape.log 2>/dev/null || echo "(scraper produced no output)"
            cat geocode.log 2>/dev/null
            cat render.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, so the hidden state is already committed and live. Turning the
      # run red is the only thing that actually reaches an inbox.
      - name: Fail if a section was hidden
        if: env.hidden == 'yes'
        run: |
          echo "::error::A section was hidden from the site - the scraped data did not pass validation. See the run summary."
          exit 1

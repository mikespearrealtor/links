name: Scrape Compass listings

# Refreshes listings.json from the Compass agent profile once per day.
# Committing to main republishes the Pages site automatically.

on:
  schedule:
    # 11:17 UTC daily = ~6:17am Houston (CDT) / 5:17am (CST).
    # GitHub runs cron in UTC and does not adjust for daylight saving.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-listings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install - the scraper is stdlib only.
      - name: Scrape listings
        run: python tools/scrape-listings.py --no-backup | tee scrape.log

      # Exit 3 is "a section was hidden because its data was unusable". That
      # is a successful render - the fix has to be committed below before the
      # run is allowed to fail, or the broken section stays on the live site.
      - name: Render into index.html
        run: |
          set +e
          python tools/render-listings.py | tee render.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "3" ]; then
            echo "hidden=yes" >> "$GITHUB_ENV"
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi

      - name: Commit if changed
        run: |
          # --porcelain also reports a file as untracked, which a plain
          # `git diff` would miss on the very first run.
          if [ -z "$(git status --porcelain -- listings.json sold.json index.html listing-photos)" ]; then
            echo "No listing changes today."
            echo "changed=no" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "changed=yes" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json sold.json index.html listing-photos
          git commit -m "Update listings from Compass profile"
          git push

      # Readable at-a-glance record on each run's own page, so a failure or a
      # surprising listing count is obvious without opening the raw logs.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Compass listings scrape"
            echo
            if [ "${hidden:-no}" = "yes" ]; then
              echo "**Result:** DATA REJECTED - a section was hidden from the site"
              echo
              echo "The scrape produced something that did not look like real"
              echo "listings, so the affected section was removed rather than"
              echo "published. The site is safe; the scraper needs a look."
            elif [ "${{ job.status }}" = "success" ]; then
              COUNT=$(python -c "import json;print(len(json.load(open('listings.json'))))" 2>/dev/null || echo "?")
              SOLD=$(python -c "import json;print(len(json.load(open('sold.json'))))" 2>/dev/null || echo "?")
              echo "**Result:** OK - $COUNT listing(s), $SOLD closed sale(s) on the profile"
              if [ "${changed:-no}" = "yes" ]; then
                echo "**Site:** updated and pushed"
              else
                echo "**Site:** no change since yesterday"
              fi
            else
              echo "**Result:** FAILED - the site was not modified"
              echo
              echo "Most likely Compass changed their page layout. See the failed step above."
            fi
            echo
            echo '```'
            cat scrape.log 2>/dev/null || echo "(scraper produced no output)"
            cat render.log 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Last, so the hidden state is already committed and live. Turning the
      # run red is the only thing that actually reaches an inbox.
      - name: Fail if a section was hidden
        if: env.hidden == 'yes'
        run: |
          echo "::error::A section was hidden from the site - the scraped data did not pass validation. See the run summary."
          exit 1
